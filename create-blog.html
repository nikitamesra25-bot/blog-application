
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Blog - BlogSpace</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header class="navbar">
    <h2>BlogSpace</h2>
    <nav>
      <a href="index.html">Home</a>
      <a href="dashboard.html">Dashboard</a>
      <a href="login.html">Logout</a>
    </nav>
  </header>

  <main class="create-container">
    <form class="create-card" id="createBlogForm">
      <h1>Create a New Blog</h1>
      <p>Share your thoughts and ideas with the world.</p>

      <label for="blogTitle">Blog Title</label>
      <input type="text" id="blogTitle" placeholder="Enter your blog title" required >

      <label for="blogImage">Image URL (optional)</label>
      <input type="url" id="blogImage" placeholder="https://example.com/image.jpg"
      >

      <label for="blogContent">Blog Content</label>
      <textarea id="blogContent" rows="8" placeholder="Write your blog here..." required></textarea>

      <button type="submit" class="btn">Publish Blog</button>

      <p id="blogMessage"></p>

      <a href="dashboard.html" class="back-link">
        Back to Dashboard
      </a>
    </form>
  </main>

  <script src="js/script.js"></script>
</body>
</html>
