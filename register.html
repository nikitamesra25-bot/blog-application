<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register BlogSpace</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header class="navbar">
        <h2>BlogSpace</h2>
        <nav>
            <a href="index.html">Home</a>
            <a href="login.html">Login</a>
        </nav>
    </header>

    <main class="auth-container">
        <form class="auth-card" id="registerForm">
            <h1>Create Account</h1>
            <p>Join BlogSpace and start sharing your stories.</p>

            <label for="name">Full Name</label>
            <input type="text" id="name" placeholder="Enter your full name" required>

            <label for="registerEmail">Email Address</label>
            <input type="email" id="registerEmail" placeholder="Enter your email" required>

            <label for="registerPassword">Password</label>
            <input type="password" id="registerPassword" placeholder="Create a password" minlength="6" required>

            <button type="submit" class="btn">Create Account</button>

            <p id="registerMessage"></p>

            <p class="auth-link">Already have an account?
                <a href="login.html">Login here</a>
            </p>
        </form>
    </main>

    <script src="js/script.js"></script>
</body>
</html>
